<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Test</title>
</head>
<body>
<h1>홍태민입니다(2218070)<span th:text="${name}"></span></h1>
<table>
    <tr th:each="item : ${articles}">
        <td th:text="${item.title}"></td>
        <td th:text="${item.content}"></td>
    </tr>
</table>

<!--    <div>-->
<!--        <p th:text="${person.name}"></p>-->
<!--        <p th:text="${person.age}"></p>-->
<!--        <p th:text="${person.id}"></p>-->
<!--    </div>-->
<div th:object="${person}">
    <p th:text="|이름: *{name}|"></p>
    <p th:text="|나이: *{age}|"></p>
    <p th:text="|아이디: *{id}|"></p>
    <!-- 취미를 ul 태크로 동적으로 생성되도록 하시오. -->
    <p>취미 목록</p>
    <ul>
        <li th:each="hobby : *{hobbies}" th:text="${hobby}"></li>
    </ul>
    <p></p>
    <p></p>
</div>
<div>
    <h4 th:text="${person.name}"></h4>
    <h4 th:text="${person.age}"></h4>
</div>

<div th:if="${error!=null}">
    에러가 발생했습니다!!!!
</div>

<div th:unless="${error!=null}">
    정상 작동 중!!!
</div>

<div th:if="${error==null}">
    정상 작동 중!!!
</div>

<p th:text="${#temporals.format(today,'yyyy-MM-dd')}"></p>
</body>
</html>
